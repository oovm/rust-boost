name: Rust

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release --all-features
      - name: Random core
        run: cargo test -p random
      - name: Random host entropy
        run: cargo test -p random --all-features

  features:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Source default features
        run: cargo test -p source
      - name: Source serde
        run: cargo test -p source --features serde
      - name: Logger
        run: cargo test -p logger
      - name: Console
        run: cargo test -p console
      - name: Diagnostic core
        run: cargo test -p diagnostic --no-default-features
      - name: Diagnostic serde
        run: cargo test -p diagnostic --features serde
      - name: Diagnostic logger
        run: cargo test -p diagnostic --features logger

  word-size:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: i686-pc-windows-msvc
      - name: Random core on a 32-bit host word
        run: cargo test -p random --no-default-features --target i686-pc-windows-msvc
      - name: Random host entropy on a 32-bit host word
        run: cargo test -p random --all-features --target i686-pc-windows-msvc

  byte-order:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: s390x-unknown-linux-gnu
      - name: Compile-only check on a big-endian target
        run: cargo check -p random --all-features --target s390x-unknown-linux-gnu

  wasi:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32-wasip1, wasm32-wasip2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: WASI preview 1 host entropy
        run: cargo test -p random --all-features --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
      - name: WASI preview 2 host entropy
        run: cargo test -p random --all-features --target wasm32-wasip2
        env:
          CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime

  web-host:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: Compile-only check of the Web Crypto bridge
        run: cargo check -p random --features web --target wasm32-unknown-unknown
      - name: The default build must not pull `wasm-bindgen`
        run: |
          if cargo tree -p random --target wasm32-unknown-unknown | grep -q wasm-bindgen; then
            echo "the default build must not depend on wasm-bindgen" >&2
            exit 1
          fi
      - name: A native build must not pull `wasm-bindgen` either
        run: |
          if cargo tree -p random --all-features | grep -q wasm-bindgen; then
            echo "a native all-features build must not depend on wasm-bindgen" >&2
            exit 1
          fi
