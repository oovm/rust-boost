[package]
name = "boost-http"
version.workspace = true
authors.workspace = true
description = "Transport-independent HTTP request and response primitives"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/boost-http"
documentation = "https://docs.rs/boost-http"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
url = { workspace = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:webpki-roots"]

[package.metadata.docs.rs]
all-features = true
