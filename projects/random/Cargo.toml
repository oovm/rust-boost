[package]
name = "random"
version.workspace = true
authors.workspace = true
description = "Deterministic random streams with a frozen output profile, unbiased sampling, and owned host entropy backends"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/random"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.155", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "0.2.95", optional = true }

[features]
default = []
std = []
system = ["dep:libc"]
web = ["dep:wasm-bindgen"]

[package.metadata.docs.rs]
all-features = true
