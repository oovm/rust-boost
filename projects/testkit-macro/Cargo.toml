[package]
name = "testkit-macro"
version.workspace = true
authors.workspace = true
description = "Procedural macros for structured `testkit` test entries"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/testkit-macro"
documentation = "https://docs.rs/testkit-macro"
readme = "readme.md"
license.workspace = true
edition.workspace = true
exclude = ["package.json", "tests/**"]

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["full"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
